<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar" aria-label="시장 선택">
    <button class="nav-button active" type="button" data-market="us">미국장</button>
    <button class="nav-button" type="button" data-market="kr">한국장</button>
  </aside>

  <main class="dashboard">
    <header class="dashboard-header">
      <div>
        <p class="eyebrow" id="market-eyebrow">US Market</p>
        <h1 id="market-title">미국장 주요 지표</h1>
      </div>
      <p id="updated-at" class="updated">차트 로딩 중</p>
    </header>

    <section id="us-view" class="chart-grid market-view active" aria-label="미국장 차트"></section>
    <section id="kr-view" class="chart-grid market-view" aria-label="한국장 차트"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
